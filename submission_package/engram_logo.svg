<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="url(#bgGrad)" rx="10"/>

  <!-- Subtle grid lines -->
  <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
  </g>

  <!-- Neural network nodes (left panel) -->
  <!-- Layer 1 nodes -->
  <circle cx="30" cy="60" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="30" cy="100" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="30" cy="140" r="5" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>

  <!-- Layer 2 nodes -->
  <circle cx="75" cy="72" r="5" fill="#00aaff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="75" cy="100" r="5" fill="#00aaff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="75" cy="128" r="5" fill="#00aaff" opacity="0.9" filter="url(#glow)"/>

  <!-- Layer 3 node (output) -->
  <circle cx="120" cy="100" r="7" fill="#ff4444" opacity="1" filter="url(#softglow)"/>

  <!-- Connections L1 -> L2 -->
  <g stroke="#00d4ff" stroke-width="0.8" opacity="0.35">
    <line x1="35" y1="60" x2="70" y2="72"/>
    <line x1="35" y1="60" x2="70" y2="100"/>
    <line x1="35" y1="60" x2="70" y2="128"/>
    <line x1="35" y1="100" x2="70" y2="72"/>
    <line x1="35" y1="100" x2="70" y2="100"/>
    <line x1="35" y1="100" x2="70" y2="128"/>
    <line x1="35" y1="140" x2="70" y2="72"/>
    <line x1="35" y1="140" x2="70" y2="100"/>
    <line x1="35" y1="140" x2="70" y2="128"/>
  </g>

  <!-- Connections L2 -> L3 -->
  <g stroke="#ff4444" stroke-width="0.9" opacity="0.5">
    <line x1="80" y1="72" x2="113" y2="100"/>
    <line x1="80" y1="100" x2="113" y2="100"/>
    <line x1="80" y1="128" x2="113" y2="100"/>
  </g>

  <!-- Vertical divider -->
  <line x1="148" y1="20" x2="148" y2="180" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Main title -->
  <text x="168" y="85" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#ffffff" filter="url(#glow)">ENGRAM</text>
  <text x="168" y="120" font-family="'Courier New', monospace" font-size="20" font-weight="normal" fill="#00d4ff" letter-spacing="6">MCP ENGINE</text>

  <!-- Tagline -->
  <text x="168" y="152" font-family="'Courier New', monospace" font-size="11" fill="#4a7fa5" letter-spacing="1">DETERMINISTIC AI ORCHESTRATION FOR MEMORY FORENSICS</text>

  <!-- Right panel — memory hex block decoration -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#1a3a5c" opacity="0.7">
    <text x="640" y="45">0xFFFF8001 EPROCESS</text>
    <text x="640" y="62">0xFFFF8002 _ETHREAD</text>
    <text x="640" y="79">0xFFFF8003 PsActive...</text>
    <text x="640" y="96">0xFFFF8004 DKOM_FLAG</text>
    <text x="640" y="113">0xFFFF8005 SSDT_HOOK</text>
    <text x="640" y="130">0xFFFF8006 Mnemosyne</text>
    <text x="640" y="147">0xFFFF8007 [UNVERIFIED]</text>
    <text x="640" y="164">0xFFFF8008 PHASE_6_OK</text>
  </g>

  <!-- Scanning line effect over hex block -->
  <rect x="635" y="35" width="195" height="140" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.2" rx="2"/>

  <!-- Status badges bottom right -->
  <rect x="640" y="175" width="90" height="16" rx="3" fill="#003320" stroke="#00aa44" stroke-width="0.8"/>
  <text x="685" y="186" font-family="'Courier New', monospace" font-size="9" fill="#00cc44" text-anchor="middle">OODA ACTIVE</text>

  <rect x="738" y="175" width="90" height="16" rx="3" fill="#1a0000" stroke="#ff4444" stroke-width="0.8"/>
  <text x="783" y="186" font-family="'Courier New', monospace" font-size="9" fill="#ff4444" text-anchor="middle">THREAT FOUND</text>

  <!-- Phase indicator dots -->
  <g fill="#00d4ff" opacity="0.8" filter="url(#glow)">
    <circle cx="168" cy="175" r="3"/>
    <circle cx="182" cy="175" r="3"/>
    <circle cx="196" cy="175" r="3"/>
    <circle cx="210" cy="175" r="3"/>
    <circle cx="224" cy="175" r="3"/>
  </g>
  <circle cx="238" cy="175" r="3" fill="#ff4444" opacity="0.8" filter="url(#glow)"/>
  <text x="252" y="179" font-family="'Courier New', monospace" font-size="9" fill="#4a7fa5">PHASE 1-5 COMPLETE | REPORTING</text>
</svg>
